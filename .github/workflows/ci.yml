name: CI

# DEBUG workflow (game-tests-debug only): loops the machine file and the
# original-vs-deluxe compare file with traces and thread dumps on a hang.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Debug hangs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      LOOPS: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Environment
        run: |
          $PSVersionTable | Out-String
          [Runtime.InteropServices.RuntimeInformation]::FrameworkDescription
          [Environment]::ProcessorCount
          (Get-Process -Id $PID).Path
      - name: Fetch pinned DASM and libpinmame
        run: |
          ./tools/Get-Dasm.ps1
          ./tools/Get-LibPinmame.ps1
      - name: Debug tools
        continue-on-error: true
        run: |
          if ($IsLinux) { sudo apt-get install -y -qq gdb > $null; gdb --version | Select-Object -First 1 }
          dotnet tool install --global dotnet-stack
          if ($IsWindows) { Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe' -ErrorAction SilentlyContinue }
      - name: Build trees (one real machine run)
        continue-on-error: true
        run: ./tools/Invoke-GameTests.ps1 -Path tests/kit/machine.tests.ps1
      - name: Loop compare file
        if: env.LOOPS != '0'
        continue-on-error: true
        env:
          EBC_DEBUG_CHILD_TIMEOUT: '120'
        run: |
          $env:PATH = "$env:PATH$([IO.Path]::PathSeparator)$(Join-Path $HOME '.dotnet/tools')"
          ./tools/Debug-Loop.ps1 -File tests/compare/original-vs-deluxe.tests.ps1 -Iterations 5 -FileTimeout 600
      - name: Loop machine file
        if: env.LOOPS != '0'
        continue-on-error: true
        run: |
          $env:PATH = "$env:PATH$([IO.Path]::PathSeparator)$(Join-Path $HOME '.dotnet/tools')"
          ./tools/Debug-Loop.ps1 -File tests/kit/machine.tests.ps1 -Tree originals,loop-score-change,8bc-deluxe -Iterations 8 -FileTimeout 300
      # Trace logs only (timestamps and machine state; no ROM bytes).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: debug-logs-${{ matrix.os }}
          if-no-files-found: warn
          path: build/debug-logs/*.log
